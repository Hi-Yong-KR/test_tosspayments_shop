<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:head -->
    <title>회원가입 | STYLEBASE</title>
    <meta name="description" content="STYLEBASE 회원가입" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STYLEBASE" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="회원가입 | STYLEBASE" />
    <meta property="og:description" content="STYLEBASE 회원가입" />
    <meta property="og:url" content="https://hi-yong-kr.github.io/test_tosspayments_shop/signup.html" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="회원가입 | STYLEBASE" />
    <meta name="twitter:description" content="STYLEBASE 회원가입" />
    <!-- /seo:head -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="signup">
    <header id="header"></header>

    <main class="inner">
      <section class="auth-box">
        <h1>회원가입</h1>
        <form class="auth-form" id="signup-form">
          <input name="name" type="text" autocomplete="name" placeholder="이름" required />
          <input name="email" type="email" autocomplete="email" placeholder="이메일" required />
          <input name="phone" type="tel" autocomplete="tel" placeholder="휴대폰 번호 (선택, 숫자만)" />
          <input name="password" type="password" autocomplete="new-password" placeholder="비밀번호 (6자 이상)" required />
          <input name="password2" type="password" autocomplete="new-password" placeholder="비밀번호 확인" required />
          <div class="hint" id="auth-hint"></div>
          <button type="submit" class="btn btn-black">가입하기</button>
        </form>
        <div class="result" id="signup-done" hidden style="margin:24px 0 0">
          <div class="icon">✓</div>
          <h2>인증 메일을 보냈어요</h2>
          <p>메일의 인증 링크를 누른 뒤 로그인해 주세요.</p>
          <div class="btn-row" style="margin-top:20px"><a href="login.html" class="btn btn-black">로그인하러 가기</a></div>
        </div>
        <div class="auth-links"><span>이미 계정이 있나요?</span><a href="login.html" id="to-login">로그인</a></div>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
