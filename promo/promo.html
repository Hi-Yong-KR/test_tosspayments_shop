<script>
// ---------- 데이터 ----------
const CUTS = [
  { id: "T002", cat: "TOPS",  brand: "COVERMOOD",    name: "에센셜 기모 스웻 후드 집업",   rate: "45%", price: "43,500원",  bg: "#e7e0d4", ink: "#111" },
  { id: "T001", cat: "TOPS",  brand: "OVERLAP",      name: "오버핏 헤비코튼 로고 반팔",    rate: "30%", price: "27,300원",  bg: "#0078ff", ink: "#fff" },
  { id: "T007", cat: "TOPS",  brand: "SAINT ROW",    name: "빈티지 워싱 그래픽 후드티",    rate: "40%", price: "53,400원",  bg: "#121212", ink: "#fff" },
  { id: "S001", cat: "SHOES", brand: "SOLEMATE",     name: "클래식 로우 레더 스니커즈",    rate: "30%", price: "69,300원",  bg: "#1d2a44", ink: "#fff" },
  { id: "S002", cat: "SHOES", brand: "TRACK CLUB",   name: "에어 쿠션 데일리 러닝화",      rate: "25%", price: "104,300원", bg: "#f1ede6", ink: "#111" },
  { id: "S004", cat: "SHOES", brand: "NORDIC FIELD", name: "스웨이드 첼시 부츠",           rate: "40%", price: "101,400원", bg: "#cfd6c4", ink: "#111" },
  { id: "P001", cat: "PANTS", brand: "COVERMOOD",    name: "와이드 스트레이트 데님 팬츠",  rate: "30%", price: "41,300원",  bg: "#111111", ink: "#fff" },
  { id: "P005", cat: "PANTS", brand: "SAINT ROW",    name: "빈티지 워싱 루즈핏 데님",      rate: "40%", price: "47,400원",  bg: "#e9e4da", ink: "#111" },
  { id: "P006", cat: "PANTS", brand: "ARCHIVE LAB",  name: "투턱 울 블렌드 와이드 슬랙스", rate: "20%", price: "71,200원",  bg: "#0078ff", ink: "#fff" },
  { id: "P008", cat: "PANTS", brand: "HIGHLINE",     name: "카고 나일론 쇼츠",             rate: "30%", price: "34,300원",  bg: "#f2f2f2", ink: "#111" },
];
const GRID = [
  "T006","T001","T002","T005","T003","T004","T010","T007","T008",
  "S001","S005","S002","S003","S004","S008","S006","S007","T009",
  "P002","P001","P007","P004","P003","P006","P005","P009","P008",
];

// ---------- 시간표(초) · 150 BPM ----------
const BEAT = 0.4;
const DURATION = 29.5;
const S = {
  sA: [0, 3.6], sB: [3.6, 5.2], sC: [5.2, 9.2], sD: [9.2, 11.6],
  sE: [11.6, 16.4], sF: [16.4, 21.2], sG: [21.2, 25.2], sH: [25.2, DURATION],
};

// ---------- 유틸 ----------
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const outExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const outCubic = (p) => 1 - Math.pow(1 - p, 3);
const inCubic = (p) => p * p * p;
const inOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const inOutQuint = (p) => (p < 0.5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2);
const outBack = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const k = (t, t0, t1, ease = (x) => x) => ease(clamp((t - t0) / (t1 - t0)));
const set = (el, o) => { for (const key in o) el.style[key] = o[key]; };
const svg = (id) => window.PRODUCT_SVG[id];
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// 마스크 줄 등장: 아래에서 위로
function maskIn(maskEl, p, dist = 1.1) {
  const s = maskEl.firstElementChild;
  s.style.transform = `translateY(${(1 - p) * dist * 100}%)`;
}
// 글자 단위 블러 등장
function splitChars(el, text) {
  el.innerHTML = [...text].map((c) => `<span>${c === " " ? " " : c}</span>`).join("");
  return [...el.children];
}
function charsIn(chars, t, t0, step = 0.04, dur = 0.9) {
  chars.forEach((c, n) => {
    const p = k(t, t0 + n * step, t0 + n * step + dur, outExpo);
    set(c, { opacity: p, transform: `translateY(${(1 - p) * 30}px)`, filter: `blur(${(1 - p) * 12}px)` });
  });
}

// ---------- 정적 구성 ----------
$("aProd").innerHTML = svg("T003");
$("aGlow").innerHTML = svg("T003");
const aL1 = splitChars($("aL1"), "옷을 고르는 시간은");
const aL2 = splitChars($("aL2"), "길어도 좋습니다.");
const dust = [];
for (let n = 0; n < 70; n++) {
  const d = document.createElement("i");
  $("aDust").appendChild(d);
  dust.push({ el: d, x: rnd() * 1920, y: rnd() * 1080, s: 0.5 + rnd() * 2, v: 8 + rnd() * 30, a: 0.15 + rnd() * 0.5, ph: rnd() * 6 });
}
GRID.forEach((id) => { const t = document.createElement("div"); t.className = "tile prod"; t.innerHTML = svg(id); $("dGrid").appendChild(t); });
document.querySelectorAll(".ghost[data-p]").forEach((g) => (g.innerHTML = svg(g.dataset.p)));
$("hLogo").innerHTML = "STYLEBASE".split("").map((c) => `<span>${c}</span>`).join("");
const cProd = CUTS.map((c) => svg(c.id));

// 화면 좌표(1920x1080) 기준 커서 경로
const cur = $("cursor"), rip = $("ripple"), tap = $("tap");
function cursorAt(x, y, show) { set(cur, { display: show ? "block" : "none", transform: `translate(${x - 8}px, ${y - 4}px)` }); }
function rippleAt(x, y, p) {
  if (p <= 0 || p >= 1) { rip.style.display = "none"; return; }
  set(rip, { display: "block", left: x + "px", top: y + "px", opacity: 1 - p, transform: `scale(${lerp(0.2, 1.3, outCubic(p))})` });
}
function tapAt(x, y, p) {
  if (p <= 0 || p >= 1) { tap.style.display = "none"; return; }
  set(tap, { display: "block", left: x + "px", top: y + "px", opacity: (1 - p) * 0.9, transform: `scale(${lerp(0.4, 1.4, outCubic(p))})` });
}
// 경유점 [시간, x, y] 사이를 부드럽게 이동
function path(l, pts) {
  if (l <= pts[0][0]) return pts[0].slice(1);
  for (let i = 1; i < pts.length; i++) {
    if (l <= pts[i][0]) {
      const p = inOutCubic((l - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
      return [lerp(pts[i - 1][1], pts[i][1], p), lerp(pts[i - 1][2], pts[i][2], p)];
    }
  }
  return pts[pts.length - 1].slice(1);
}

// ---------- 씬 ----------
const scenes = {
  sA(t) {
    const zoom = lerp(1.0, 1.07, k(t, 0, 3.6, (x) => x));
    const lit = k(t, 0.0, 2.2, outCubic);
    const out = k(t, 3.15, 3.6, inCubic);
    set($("aProd"), { opacity: lit, transform: `scale(${zoom + out * 1.4}) translateX(${out * -120}px)`,
      filter: `brightness(${lerp(0.15, 0.62, lit)}) contrast(1.15) saturate(.8)` });
    set($("aGlow"), { opacity: lit * 0.12, transform: `scale(${zoom + out * 1.4})` });
    $("aSweep").style.transform = `translateX(${lerp(-1400, 1400, k(t, 0.3, 3.0, inOutCubic))}px)`;
    dust.forEach((d) => {
      const y = (d.y - t * d.v + 1080) % 1080, x = d.x + Math.sin(t * 0.8 + d.ph) * 14;
      set(d.el, { transform: `translate(${x}px, ${y}px) scale(${d.s})`, opacity: d.a * lit });
    });
    charsIn(aL1, t, 0.35, 0.045, 1.0);
    charsIn(aL2, t, 1.45, 0.05, 1.0);
    const textOut = k(t, 3.0, 3.45, inCubic);
    set($("aL1"), { opacity: 1 - textOut, transform: `translateX(${-textOut * 60}px)` });
    set($("aL2"), { opacity: 1 - textOut, transform: `translateX(${-textOut * 60}px)` });
    $("sA").style.opacity = 1 - k(t, 3.45, 3.6);
  },
  sB(t) {
    const l = t - S.sB[0];
    maskIn($("bL1"), k(l, 0, 0.45, outExpo));
    maskIn($("bL2"), k(l, 0.4, 0.85, outExpo));
    const dp = k(l, 0.75, 1.0, outBack);
    $("bDot").style.transform = `scale(${dp})`;
    // 마지막 박자에 왼쪽으로 빠르게 퇴장
    const out = k(l, 1.25, 1.6, inCubic);
    $("bL1").style.transform = `translateX(${-out * 2200}px)`;
    $("bL2").style.transform = `translateX(${-out * 2600}px)`;
  },
  sC(t) {
    const l = t - S.sC[0];
    const i = Math.min(CUTS.length - 1, Math.floor(l / BEAT));
    const c = CUTS[i], cl = l - i * BEAT;
    if ($("cProd").dataset.i !== String(i)) {
      $("cProd").dataset.i = i;
      $("cProd").innerHTML = cProd[i];
      $("cWord").textContent = c.cat;
      $("cBrand").textContent = c.brand;
      $("cName").textContent = c.name;
      $("cRate").textContent = c.rate;
      $("cNow").textContent = c.price;
      $("cCat").textContent = c.cat;
      $("cCount").textContent = String(i + 1).padStart(2, "0") + " / 27";
      $("cBg").style.background = c.bg;
      $("sC").style.color = c.ink;
      $("cWord").style.opacity = c.ink === "#fff" ? 0.22 : 0.16;
    }
    const pop = k(cl, 0, 0.3, outExpo);
    const dir = i % 2 ? 1 : -1;
    const float = Math.sin(l * 3) * 6;
    set($("cProd"), { transform: `translateY(${float}px) scale(${lerp(1.22, 1, pop)}) rotate(${dir * (1 - pop) * 6}deg)`,
      filter: `drop-shadow(0 ${30}px ${40}px rgba(0,0,0,.25))` });
    set($("cFloor"), { opacity: pop, transform: `scaleX(${lerp(1.3, 1, pop)})` });
    set($("cMeta"), { opacity: pop, transform: `translateY(${(1 - pop) * 26}px)` });
    $("cWord").style.transform = `translateX(${dir * lerp(80, -80, cl / BEAT)}px)`;
    $("cFlash").style.opacity = (1 - k(cl, 0, 0.07)) * 0.85;
  },
  sD(t) {
    const l = t - S.sD[0];
    // 가운데 타일에서 시작해 전체로 빠지는 달리 아웃
    const z = lerp(3.4, 1.0, k(l, 0, 1.6, inOutQuint));
    $("dCam").style.transform = `scale(${z}) rotate(${lerp(-3, 0, k(l, 0, 1.6, outCubic))}deg)`;
    $("dCam").style.transformOrigin = "960px 540px";
    [...$("dGrid").children].forEach((tile, n) => {
      const r = Math.floor(n / 9), c = n % 9;
      const dist = Math.hypot(r - 1, (c - 4) / 2);
      const p = k(l, dist * 0.12, dist * 0.12 + 0.5, outExpo);
      set(tile, { opacity: p, transform: `scale(${lerp(0.85, 1, p)})` });
    });
    $("dVeil").style.opacity = k(l, 1.25, 1.6, outCubic);
    maskIn($("dCap").children[0], k(l, 1.3, 1.75, outExpo));
    const sm = k(l, 1.5, 1.9, outExpo);
    set($("dCap").children[1], { opacity: sm, transform: `translateY(${(1 - sm) * 20}px)` });
    $("sD").style.clipPath = `inset(0 0 ${k(l, 2.1, 2.4, inCubic) * 100}% 0)`;
  },
  sE(t) {
    const l = t - S.sE[0];
    const SC = 1300 / 1440, X0 = 520, Y0 = 154; // 브라우저 뷰포트의 화면 좌표
    const enter = k(l, 0, 0.9, outExpo);
    set($("eWin"), { opacity: enter, transform: `perspective(2600px) translateX(${(1 - enter) * 500}px) rotateY(${lerp(-26, 0, enter)}deg)` });
    maskIn($("eCap").children[0], k(l, 0.25, 0.75, outExpo));
    maskIn($("eCap").children[1], k(l, 0.4, 0.9, outExpo));
    const sp = k(l, 0.7, 1.2, outExpo);
    set($("eCap").children[2], { opacity: sp, transform: `translateY(${(1 - sp) * 20}px)` });
    // 상품 클릭(1.6) → 모달
    const modal = k(l, 1.62, 1.85, outCubic);
    set($("eModal"), { opacity: modal, transform: `scale(${lerp(1.03, 1, modal)})` });
    // 커서: 카드 → 사이즈 L → 바로 구매
    const card = [X0 + 720 * SC, Y0 + 552 * SC], size = [X0 + 890 * SC, Y0 + 435 * SC], buy = [X0 + 1015 * SC, Y0 + 658 * SC];
    const [x, y] = path(l, [[0.6, 1500, 1010], [1.5, ...card], [1.9, ...card], [2.35, ...size], [2.55, ...size], [3.1, ...buy]]);
    cursorAt(x, y, l > 0.6 && l < 3.6);
    const clickP = (c) => k(l, c, c + 0.45);
    const r1 = clickP(1.6), r2 = clickP(2.4), r3 = clickP(3.2);
    if (r1 > 0 && r1 < 1) rippleAt(...card, r1); else if (r2 > 0 && r2 < 1) rippleAt(...size, r2); else rippleAt(...buy, r3);
    // 바로 구매 눌림
    const press = k(l, 3.2, 3.3) * (1 - k(l, 3.3, 3.5));
    set($("ePress"), { left: 929 * SC + "px", top: 632.7 * SC + "px", width: 173 * SC + "px", height: 52 * SC + "px", opacity: press });
    // 버튼으로 카메라 진입 → 흰 화면
    const push = k(l, 3.35, 4.8, (p) => inCubic(p));
    $("eCam").style.transform = `scale(${1 + push * 9})`;
    $("sE").style.filter = `brightness(${1 + k(l, 4.2, 4.8) * 4})`;
  },
  sF(t) {
    const l = t - S.sF[0];
    const M = 413 / 390, SX = 344, SY = 84;
    const enter = k(l, 0, 0.8, outExpo);
    set($("fPhone"), { opacity: 1, transform: `translateY(${(1 - enter) * 700}px) rotate(${(1 - enter) * -8}deg)` });
    // 스크롤: 상단 → 결제수단(토스페이) → 결제 버튼
    const s1 = 1065, s2 = 1680;
    const scroll = lerp(0, s1, k(l, 0.5, 1.55, inOutCubic)) + (s2 - s1) * k(l, 2.05, 2.6, inOutCubic);
    $("fCheckout").style.transform = `translateY(${-scroll * M}px)`;
    // 토스페이 선택 표시
    const box = (el, x, y, w, h) => set(el, { left: x * M + "px", top: (y - scroll) * M + "px", width: w * M + "px", height: h * M + "px" });
    box($("fSel"), 139, 1462, 112, 54);
    box($("fUnsel"), 15, 1394, 360, 57);
    const picked = l >= 1.95;
    $("fSel").style.opacity = picked ? 1 : 0;
    $("fUnsel").style.opacity = picked ? 1 : 0;
    // 탭
    const tossTap = [SX + 195 * M, SY + (1489 - s1) * M], payTap = [SX + 195 * M, SY + (2117 - s2) * M];
    const t1 = k(l, 1.9, 2.3), t2 = k(l, 2.8, 3.2);
    if (t1 > 0 && t1 < 1) tapAt(...tossTap, t1); else tapAt(...payTap, t2);
    // 결제 완료 화면
    const done = k(l, 3.1, 3.45, outExpo);
    set($("fSuccess"), { opacity: done, transform: `translateY(${(1 - done) * 60}px)` });
    // 오른쪽 문구
    const phase = l < 1.6 ? 0 : l < 3.1 ? 1 : 2;
    const W = [
      ["STEP 2 — 주문서", "주문하고,", "배송지 입력은 한 번이면 충분하게."],
      ["STEP 3 — 결제", '<span class="blue">토스</span>로 결제.', "토스페이 · 카카오페이 · 네이버페이 · 카드 · 계좌이체"],
      ["DONE", "끝.", "87,000원 결제 완료 — 회원가입 없이."],
    ][phase];
    const fK = $("fK");
    if (fK.dataset.p !== String(phase)) {
      fK.dataset.p = phase;
      fK.textContent = W[0];
      $("fW").innerHTML = `<span class="mask"><span>${W[1]}</span></span>`;
      $("fS").textContent = W[2];
    }
    const ps = [0.35, 1.6, 3.1][phase];
    const pp = k(l, ps, ps + 0.45, outExpo);
    maskIn($("fW").firstElementChild, pp);
    set(fK, { opacity: pp });
    const sp = k(l, ps + 0.15, ps + 0.6, outExpo);
    set($("fS"), { opacity: sp, transform: `translateY(${(1 - sp) * 18}px)` });
    $("fW").style.fontSize = phase === 2 ? "230px" : "150px";
    // 단계 표시
    const on = [true, true, l >= 1.6, l >= 3.1];
    on.forEach((v, n) => $("fs" + n).classList.toggle("on", v));
    const stIn = k(l, 0.3, 0.8, outExpo);
    set($("fSteps"), { opacity: stIn, transform: `translateY(${(1 - stIn) * 20}px)` });
    $("sF").style.clipPath = `inset(0 ${k(l, 4.45, 4.8, inCubic) * 100}% 0 0)`;
  },
  sG(t) {
    const l = t - S.sG[0];
    [["gP1", 0], ["gP2", 1.2], ["gP3", 2.4]].forEach(([id, t0]) => {
      const el = $(id);
      el.style.display = l >= t0 ? "flex" : "none";
      if (l < t0) return;
      const p = k(l, t0, t0 + 0.35, outExpo);
      el.style.clipPath = `inset(0 0 0 ${(1 - p) * 100}%)`;
      const masks = el.querySelectorAll(".h .mask");
      masks.forEach((m, n) => maskIn(m, k(l, t0 + 0.1 + n * 0.1, t0 + 0.6 + n * 0.1, outExpo)));
      const kk = k(l, t0 + 0.2, t0 + 0.6, outExpo);
      set(el.querySelector(".k"), { opacity: kk * 0.6, transform: `translateY(${(1 - kk) * 16}px)` });
      const g = el.querySelector(".ghost");
      g.style.transform = `translateY(${(l - t0) * -40}px) rotate(${(l - t0) * 3}deg)`;
      el.querySelector(".h").style.transform = `scale(${lerp(1.0, 1.04, k(l, t0, t0 + 1.6))})`;
    });
  },
  sH(t) {
    const l = t - S.sH[0];
    [...$("hLogo").children].forEach((sp, n) => {
      const p = k(l, 0.05 + n * 0.045, 0.75 + n * 0.045, outExpo);
      set(sp, { opacity: p, transform: `translateY(${(1 - p) * 140}px) scale(${lerp(1.3, 1, p)})`, filter: `blur(${(1 - p) * 18}px)` });
    });
    $("hLogo").style.letterSpacing = lerp(-0.045, 0.0, k(l, 0, 4.3, outCubic)) + "em";
    $("hShine").style.letterSpacing = $("hLogo").style.letterSpacing;
    $("hShine").style.backgroundPosition = `${lerp(110, -10, k(l, 1.0, 2.2, inOutCubic))}% 0`;
    const ln = k(l, 0.9, 1.7, outExpo);
    set($("hLine"), { width: ln * 760 + "px", marginLeft: -ln * 380 + "px", opacity: 0.8 - k(l, 1.7, 2.4) * 0.5 });
    const tg = k(l, 1.2, 2.2, outExpo);
    set($("hTag"), { opacity: tg, transform: `translateY(${(1 - tg) * 24}px)`, filter: `blur(${(1 - tg) * 8}px)` });
    const sb = k(l, 1.7, 2.7, outExpo);
    set($("hSub"), { opacity: sb });
    $("sH").style.transform = `scale(${lerp(1.0, 1.035, k(l, 0, 4.3))})`;
  },
};

function render(t) {
  cursorAt(0, 0, false); rippleAt(0, 0, 0); tapAt(0, 0, 0);
  for (const id in S) {
    const [a, b] = S[id];
    const on = t >= a && t < b;
    $(id).style.display = on ? "block" : "none";
    if (on) scenes[id](t);
  }
  // 어두운 씬일수록 비네팅을 진하게
  const dark = (t < 3.6) || (t >= 25.2) || (t >= 11.6 && t < 16.4);
  $("vignette").style.opacity = dark ? 1 : 0.35;
  const f = Math.floor(t * 30);
  $("grain").style.transform = `translate(${(f * 37) % 100 - 50}px, ${(f * 61) % 100 - 50}px)`;
  $("fade").style.opacity = Math.max(1 - k(t, 0, 0.5), k(t, DURATION - 0.8, DURATION));
}
window.render = render;
window.DURATION = DURATION;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))])
  .then(() => document.fonts.load('900 100px "Pretendard"'))
  .then(() => document.fonts.load('300 100px "Pretendard"'));

// 브라우저에서 직접 열면 실시간 재생 (?t=12 로 특정 시점 확인)
const q = new URLSearchParams(location.search);
if (q.has("t")) window.ready.then(() => render(parseFloat(q.get("t"))));
else if (!q.has("render")) {
  window.ready.then(() => {
    const audio = new Audio("assets/music.wav");
    const start = performance.now();
    audio.play().catch(() => {});
    const loop = () => { render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
