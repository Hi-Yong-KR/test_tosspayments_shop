<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:head -->
    <title>결제 실패 | STYLEBASE</title>
    <meta name="description" content="결제에 실패했습니다." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STYLEBASE" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="결제 실패 | STYLEBASE" />
    <meta property="og:description" content="결제에 실패했습니다." />
    <meta property="og:url" content="https://hi-yong-kr.github.io/test_tosspayments_shop/fail.html" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="결제 실패 | STYLEBASE" />
    <meta name="twitter:description" content="결제에 실패했습니다." />
    <!-- /seo:head -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="fail">
    <header id="header"></header>

    <main class="inner">
      <section class="result">
        <div class="icon fail">!</div>
        <h2>결제에 실패했습니다</h2>
        <p id="f-message">결제 처리 중 문제가 발생했습니다.</p>

        <dl class="result-table">
          <div><dt>에러 코드</dt><dd id="f-code"></dd></div>
          <div><dt>주문번호</dt><dd id="f-order"></dd></div>
        </dl>

        <div class="btn-row">
          <a href="tops.html" class="btn">쇼핑 계속하기</a>
          <a href="checkout.html" class="btn btn-black" id="f-retry">다시 결제하기</a>
        </div>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script>
      appReady.then(async () => {
        const q = new URLSearchParams(location.search);
        const orderId = q.get("orderId") || "";
        document.getElementById("f-message").textContent = q.get("message") || "결제 처리 중 문제가 발생했습니다.";
        document.getElementById("f-code").textContent = q.get("code") || "-";
        document.getElementById("f-order").textContent = orderId || "-";

        // 실패 코드/메시지를 주문에 기록하고 상태를 failed 로 변경 (FR-6.6)
        if (orderId) await callFn("confirm-payment", { action: "fail", orderId, failCode: q.get("code"), failMessage: q.get("message") });
      });
    </script>
  </body>
</html>
