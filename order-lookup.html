<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비회원 주문조회 | STYLEBASE</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="lookup">
    <header id="header"></header>

    <main class="inner">
      <section class="auth-box" id="lookup-box">
        <h1>비회원 주문조회</h1>
        <form class="lookup-form" id="lookup-form">
          <input name="orderId" type="text" placeholder="주문번호 (ORD-...)" required />
          <input name="phone" type="tel" placeholder="주문자 연락처 (숫자만)" required />
          <div class="hint" id="lookup-hint"></div>
          <button type="submit" class="btn btn-black">조회하기</button>
        </form>
        <p class="auth-note">주문 시 입력한 주문자 휴대폰 번호와 결제 완료 화면의 주문번호로 조회할 수 있어요. 개인정보 보호를 위해 일정 횟수 이상 틀리면 잠시 조회가 제한됩니다.</p>
      </section>
      <section class="detail-box" id="lookup-result" hidden></section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script src="js/order-lookup.js"></script>
  </body>
</html>
