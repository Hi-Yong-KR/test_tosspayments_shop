<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신발 | STYLEBASE</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="shoes">
    <header id="header"></header>

    <main class="inner">
      <section class="page-head" id="page-head"></section>
      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <div class="sort" id="sort">
          <button type="button" data-sort="rank">랭킹순</button>
          <button type="button" data-sort="discount">할인율순</button>
          <button type="button" data-sort="low">낮은가격순</button>
          <button type="button" data-sort="high">높은가격순</button>
          <button type="button" data-sort="review">후기순</button>
        </div>
      </div>
      <section class="grid" id="grid"></section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script src="js/list.js"></script>
  </body>
</html>
