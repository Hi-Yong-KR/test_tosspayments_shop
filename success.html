<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결제 완료 | STYLEBASE</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="success">
    <header id="header"></header>

    <main class="inner">
      <section class="result">
        <div class="icon" id="r-icon">✓</div>
        <h2 id="r-title">결제 요청이 완료되었습니다</h2>
        <p id="r-desc">주문해 주셔서 감사합니다.</p>

        <dl class="result-table">
          <div><dt>주문번호</dt><dd id="r-order"></dd></div>
          <div><dt>주문상품</dt><dd id="r-name"></dd></div>
          <div><dt>결제금액</dt><dd id="r-amount"></dd></div>
          <div><dt>결제유형</dt><dd id="r-type"></dd></div>
          <div><dt>paymentKey</dt><dd id="r-key"></dd></div>
        </dl>

        <div class="btn-row">
          <a href="tops.html" class="btn">쇼핑 계속하기</a>
          <a href="tops.html" class="btn btn-black">홈으로</a>
        </div>

        <div class="dev-note">
          <strong>개발 안내</strong><br />
          토스페이먼츠는 successUrl로 이동한 뒤 <b>10분 안에 결제 승인 API</b>(<code>POST /v1/payments/confirm</code>)를 호출해야 결제가 최종 완료됩니다.
          승인 API는 시크릿 키가 필요하므로 반드시 서버에서 호출하세요. 현재는 퍼블리싱 단계라 승인 호출이 빠져 있습니다.
        </div>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const q = new URLSearchParams(location.search);
        const orderId = q.get("orderId") || "";
        const amount = Number(q.get("amount"));
        const paymentKey = q.get("paymentKey") || "";
        const paymentType = q.get("paymentType") || "";

        let pending = null;
        try {
          pending = JSON.parse(sessionStorage.getItem("sb_pending_order"));
        } catch (e) {}

        const set = (id, v) => (document.getElementById(id).textContent = v);

        // 결제 요청 시 저장한 주문과 금액이 일치하는지 검증
        if (!pending || pending.orderId !== orderId || pending.amount !== amount) {
          document.getElementById("r-icon").className = "icon fail";
          document.getElementById("r-icon").textContent = "!";
          set("r-title", "주문 정보가 일치하지 않습니다");
          set("r-desc", "결제 금액 또는 주문번호가 요청 정보와 다릅니다. 고객센터로 문의해 주세요.");
        } else {
          // 주문한 상품을 장바구니/바로구매 목록에서 정리
          if (pending.mode === "cart") Cart.clear();
          sessionStorage.removeItem("sb_direct");
          sessionStorage.removeItem("sb_pending_order");
          set("r-desc", `${pending.customerName}님, 주문해 주셔서 감사합니다.`);
          set("r-name", pending.orderName);
        }

        set("r-order", orderId || "-");
        set("r-amount", amount ? won(amount) : "-");
        set("r-type", { NORMAL: "일반결제", BRANDPAY: "브랜드페이", KEYIN: "키인결제" }[paymentType] || paymentType || "-");
        set("r-key", paymentKey || "-");
        if (!document.getElementById("r-name").textContent) set("r-name", "-");
      });
    </script>
  </body>
</html>
