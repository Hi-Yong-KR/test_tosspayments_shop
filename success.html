<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결제 완료 | STYLEBASE</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="success">
    <header id="header"></header>

    <main class="inner">
      <section class="result">
        <div class="icon" id="r-icon">✓</div>
        <h2 id="r-title">결제 요청이 완료되었습니다</h2>
        <p id="r-desc">주문해 주셔서 감사합니다.</p>

        <dl class="result-table">
          <div><dt>주문번호</dt><dd id="r-order"></dd></div>
          <div><dt>주문상품</dt><dd id="r-name"></dd></div>
          <div><dt>결제금액</dt><dd id="r-amount"></dd></div>
          <div><dt>결제유형</dt><dd id="r-type"></dd></div>
          <div><dt>paymentKey</dt><dd id="r-key"></dd></div>
        </dl>

        <div class="btn-row">
          <a href="tops.html" class="btn">쇼핑 계속하기</a>
          <a href="mypage.html" class="btn btn-black" id="r-orders">주문 내역</a>
        </div>

      </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script>
      appReady.then(async () => {
        const q = new URLSearchParams(location.search);
        const orderId = q.get("orderId") || "";
        const amount = Number(q.get("amount"));
        const paymentKey = q.get("paymentKey") || "";
        const paymentType = q.get("paymentType") || "";
        const set = (id, v) => (document.getElementById(id).textContent = v);

        set("r-order", orderId || "-");
        set("r-amount", amount ? won(amount) : "-");
        set("r-type", { NORMAL: "일반결제", BRANDPAY: "브랜드페이", KEYIN: "키인결제" }[paymentType] || paymentType || "-");
        set("r-key", paymentKey || "-");
        set("r-title", "결제를 확인하고 있습니다...");
        set("r-desc", "잠시만 기다려 주세요.");

        // 서버(Edge Function)가 금액을 검증하고 토스 결제 승인 API를 호출한다
        const res = await callFn("confirm-payment", { paymentKey, orderId, amount });
        if (!res.ok) {
          document.getElementById("r-icon").className = "icon fail";
          document.getElementById("r-icon").textContent = "!";
          set("r-title", "결제 승인에 실패했습니다");
          set("r-desc", res.error.message || "결제 승인 중 문제가 발생했습니다. 고객센터로 문의해 주세요.");
          set("r-name", "-");
          return;
        }

        const o = res.data.order;
        sessionStorage.removeItem("sb_direct");
        await Cart.load();
        renderCartCount();
        renderDrawer();
        set("r-title", "결제가 완료되었습니다");
        set("r-desc", `${o.ordererName}님, 주문해 주셔서 감사합니다.`);
        set("r-name", o.orderName);
        set("r-amount", won(o.amount));
        set("r-type", o.paymentMethod || "-");
        set("r-key", o.paymentKey || "-");
        if (!Auth.isMember) {
          set("r-desc", `${o.ordererName}님, 주문해 주셔서 감사합니다. 비회원 주문조회를 위해 주문번호를 꼭 기억해 주세요.`);
        }
      });
    </script>
  </body>
</html>
