<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:head -->
    <title>주문서 | STYLEBASE</title>
    <meta name="description" content="주문 상품과 배송지를 확인하고 결제합니다." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STYLEBASE" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="주문서 | STYLEBASE" />
    <meta property="og:description" content="주문 상품과 배송지를 확인하고 결제합니다." />
    <meta property="og:url" content="https://hi-yong-kr.github.io/test_tosspayments_shop/checkout.html" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="주문서 | STYLEBASE" />
    <meta name="twitter:description" content="주문 상품과 배송지를 확인하고 결제합니다." />
    <!-- /seo:head -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- 토스페이먼츠 SDK v2 -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
  </head>
  <body data-page="checkout">
    <header id="header"></header>

    <main class="inner">
      <section class="page-head">
        <div class="breadcrumb">홈 &gt; 장바구니 &gt; 주문서</div>
        <h1 class="page-title">주문서</h1>
      </section>

      <div class="checkout">
        <div>
          <section class="section">
            <h3>주문 상품 <span id="item-count" style="color: var(--gray-500); font-weight: 500"></span></h3>
            <div id="order-items"></div>
          </section>

          <section class="section">
            <h3>주문자 정보</h3>
            <div class="form-grid">
              <label for="c-name">이름</label>
              <input id="c-name" type="text" autocomplete="name" placeholder="이름을 입력하세요" />
              <label for="c-email">이메일</label>
              <input id="c-email" type="email" autocomplete="email" placeholder="example@email.com" />
              <label for="c-phone">휴대폰 번호</label>
              <input id="c-phone" type="tel" autocomplete="tel" placeholder="숫자만 입력 (01012345678)" />
            </div>
          </section>

          <section class="section">
            <h3>배송지 정보</h3>
            <label class="same-check"><input type="checkbox" id="same-as-orderer" /> 주문자 정보와 동일</label>
            <div class="form-grid">
              <label for="s-name">받는 분</label>
              <input id="s-name" type="text" autocomplete="shipping name" placeholder="받는 분 이름" />
              <label for="s-phone">연락처</label>
              <input id="s-phone" type="tel" autocomplete="shipping tel" placeholder="숫자만 입력 (01012345678)" />
              <label for="s-zip">우편번호</label>
              <input id="s-zip" type="text" autocomplete="shipping postal-code" placeholder="우편번호" />
              <label for="s-addr1">주소</label>
              <input id="s-addr1" type="text" autocomplete="shipping address-line1" placeholder="기본 주소" />
              <label for="s-addr2">상세 주소</label>
              <input id="s-addr2" type="text" autocomplete="shipping address-line2" placeholder="상세 주소" />
            </div>
          </section>

          <section class="section">
            <h3>결제 수단</h3>
            <!-- 결제 UI -->
            <div id="payment-method"></div>
            <!-- 이용약관 UI -->
            <div id="agreement"></div>
          </section>
        </div>

        <aside class="summary" id="summary"></aside>
      </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script src="js/checkout.js"></script>
  </body>
</html>
